
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RecargaPay Cashback</title>
  <link rel="icon" href="logo.png" type="image/png">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to bottom, #ffffff, #e8f4ff);
      color: #222;
    }
    header {
      background: #ffffff;
      padding: 15px 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      display: flex;
      justify-content: center;
    }
    header img {
      max-height: 60px;
    }
    .container {
      max-width: 600px;
      margin: 40px auto;
      text-align: center;
    }
    h1 {
      color: #004aad;
      font-size: 24px;
    }
    .btn {
      background-color: #ff7a00;
      color: #fff;
      padding: 15px 25px;
      margin: 15px 10px;
      display: inline-block;
      border-radius: 10px;
      text-decoration: none;
      font-size: 18px;
      transition: background-color 0.3s ease;
    }
    .btn:hover {
      background-color: #e06700;
    }
    @media (max-width: 480px) {
      .btn {
        display: block;
        margin: 15px auto;
        width: 80%;
      }
    }
  </style>
</head>
<body>
  <header>
    <img src="logo.png" alt="RecargaPay Logo">
  </header>
  <div class="container">
    <h1>Escolha um valor e receba seu cashback automático</h1>
    <a class="btn" href="valor10.html">Depositar R$10</a>
    <a class="btn" href="valor25.html">Depositar R$25</a>
    <a class="btn" href="valor50.html">Depositar R$50</a>
    <a class="btn" href="valor100.html">Depositar R$100</a>
  </div>
</body>
</html>
